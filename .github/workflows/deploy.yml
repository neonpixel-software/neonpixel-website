name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.THEME_REPO_PAT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish
        run: dotnet publish src/NeonPixel.Web -c Release -o out --no-restore

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: publish-output
          path: out/
          retention-days: 1

  deploy:
    needs: build-test-publish
    runs-on: ubuntu-latest
    steps:
      - name: Download publish output
        uses: actions/download-artifact@v4
        with:
          name: publish-output
          path: out/

      # VPS_KNOWN_HOSTS is a pinned host key (from `ssh-keyscan`, run once by a human --
      # see DEPLOYMENT.md), not fetched fresh by this workflow, so StrictHostKeyChecking
      # can stay on instead of trusting whatever key a MITM'd first connection presents.
      # Secrets are routed through env: rather than expanded directly into the run
      # script (SonarCloud githubactions:S7636) -- keeps the literal secret value out
      # of the script text itself, so it can't break shell quoting/syntax if it ever
      # contains special characters, matching how every other step in this file
      # already handles secrets.
      - name: Set up SSH
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Check SSH connectivity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "echo connected"

      - name: Compute release id
        id: release
        run: echo "id=$(date -u +%Y-%m-%dT%H-%M-%S)" >> "$GITHUB_OUTPUT"

      # Each deploy gets its own releases/<id> directory rather than overwriting in
      # place -- see DEPLOYMENT.md. shared/wwwroot/media is where Umbraco's uploaded
      # media library actually lives, persisted across every release (it's runtime
      # state, never part of the publish output); ensuring it exists here is idempotent.
      - name: Create release directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p $VPS_DEPLOY_PATH/releases/${{ steps.release.outputs.id }} $VPS_DEPLOY_PATH/shared/wwwroot/media"

      - name: Upload release via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            out/ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/releases/${{ steps.release.outputs.id }}/"

      # Symlinked in after the upload (not excluded from it -- there's nothing to
      # exclude, wwwroot/media is never part of the publish output) so every release
      # serves the same persistent media library instead of starting empty.
      - name: Symlink shared media into the release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "ln -sfn $VPS_DEPLOY_PATH/shared/wwwroot/media $VPS_DEPLOY_PATH/releases/${{ steps.release.outputs.id }}/wwwroot/media"

      # Keeps both the SQLite db path AND the env file's own location out of the repo
      # entirely (not even in appsettings.Production.json) -- resolved from GitHub
      # Actions secrets on every deploy. The systemd unit's EnvironmentFile directive
      # (see DEPLOYMENT.md) reads this file, overriding ConnectionStrings:umbracoDbDSN
      # via ASP.NET Core's standard __ env-var config convention. Lives outside
      # VPS_DEPLOY_PATH entirely, so it's untouched by the releases/current
      # restructuring below.
      - name: Write production connection string
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DB_PATH: ${{ secrets.VPS_DB_PATH }}
          VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cat > $VPS_ENV_FILE" <<EOF
          ConnectionStrings__umbracoDbDSN=Data Source=$VPS_DB_PATH;Cache=Shared;Foreign Keys=True;Pooling=True
          EOF

      # Atomic: write to a temp name, then rename over "current" -- the systemd unit
      # (WorkingDirectory/ExecStart both point at VPS_DEPLOY_PATH/current, see
      # DEPLOYMENT.md) never sees a broken or half-updated symlink. Never prunes the
      # release "current" points at.
      - name: Switch current symlink and prune old releases
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd $VPS_DEPLOY_PATH && \
             ln -sfn releases/${{ steps.release.outputs.id }} current.tmp && \
             mv -Tf current.tmp current && \
             ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf"

      # VPS_SERVICE_NAME is the bare unit name (see DEPLOYMENT.md), but the sudoers
      # NOPASSWD grant is for the exact command "systemctl restart <name>.service" --
      # sudoers matches the full argument list literally, so the .service suffix here
      # isn't cosmetic, it's required for this to match and skip the password prompt.
      - name: Restart service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SERVICE_NAME: ${{ secrets.VPS_SERVICE_NAME }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo systemctl restart $VPS_SERVICE_NAME.service"

      # systemctl restart (Type=simple) returns as soon as the process is forked, not once
      # Kestrel is actually ready -- Umbraco's cold boot (cache seeding, uSync import, JIT)
      # can take anywhere from a few seconds to over a minute. Retries instead of a single
      # immediate check, which was seen failing on a real deploy that had, in fact, fully
      # succeeded a few seconds later.
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://neonpixel.eu/")
            if [ "$status" = "200" ] || [ "$status" = "302" ]; then
              echo "Site returned $status after $i attempt(s)"
              exit 0
            fi
            echo "Attempt $i: site returned $status, retrying in 5s..."
            sleep 5
          done
          echo "Site did not return 200 or 302 (redirect to /nl/) after 12 attempts"
          exit 1
