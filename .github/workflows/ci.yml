name: CI

# GitHub Flow: main is the only long-lived branch. CI runs on every PR targeting it
# (feature/* or otherwise) -- there's no develop to also trigger on. See SPEC.md.
#
# SonarCloud analysis runs separately, via its own GitHub App (Automatic Analysis
# mode) rather than a job here -- it hooks into PR events directly and posts its own
# "SonarCloud Code Analysis" status check, no SONAR_TOKEN or scanner step needed. See
# DEPLOYMENT.md's "SonarCloud" section.
on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Dependabot-triggered runs never get custom secrets (GitHub's own policy, so a
      # compromised/malicious dependency bump can't exfiltrate them) -- THEME_REPO_PAT
      # resolves empty there, which newer actions/checkout versions treat as "required
      # input not supplied" and hard-fail on, rather than the older silent fallback.
      # Skips the private submodule for those runs instead (github.token still works
      # fine for a plain checkout of this, the public, repo) -- theme/'s Exists() guards
      # in NeonPixel.Web.csproj/Program.cs already make a submodule-less build succeed
      # cleanly, just without theme content, same as any clone without submodule access.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: ${{ github.actor != 'dependabot[bot]' }}
          token: ${{ github.actor == 'dependabot[bot]' && github.token || secrets.THEME_REPO_PAT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
